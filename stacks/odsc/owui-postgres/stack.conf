# Metadata for the owui-postgres stack. Sourced as shell; keep it to key=value.

DESCRIPTION="Dedicated PostgreSQL+pgvector server for OWUI-based chatbots"

# Shared infra band (20-39), same as the `postgres` stack (20): this is
# infrastructure every OWUI app stack (morrow-plots, and future ones) depends
# on. Deliberately NOT 20 itself -- that value belongs to the `postgres`
# stack; two stacks may share a band but ORDER is still read as one ascending
# sequence across the whole VM.
ORDER=25
ENABLED=1

# Its own private network -- NOT `db`, which belongs to the `postgres` stack.
# Two Postgres clusters with the same network name would be indistinguishable
# to anything joining it; `stacks up` creates this one if missing.
NETWORKS="owui-db"

# Block until healthy, same reasoning as the `postgres` stack: OWUI app
# stacks' provisioning jobs need it accepting connections first.
WAIT=1

PROJECT=owui-postgres

# Image tracking for `stacks bump`:  <ENV_VAR> <image-ref-without-tag> <tag-regex>
#
# pgvector/pgvector, not plain postgres: this cluster exists specifically to
# provide the vector extension to OWUI apps. It is postgres:18 with that
# extension's files added -- see README.md "Why a second Postgres server".
#
# Anchored to the pg18 line and to <major>.<minor>.<patch>-pg18 tags only,
# same reasoning as the `postgres` stack's own IMAGES line: excludes the
# moving `pg18` tag and the next Postgres major.
IMAGES="
POSTGRES_TAG pgvector/pgvector ^[0-9]+\.[0-9]+\.[0-9]+-pg18$
"
