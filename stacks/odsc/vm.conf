# Identity of one VM. Sourced as shell; keep it to key=value.
#
# The presence of this file is what makes stacks/odsc/ a VM directory: `stacks`
# discovers VMs by looking for it. Stacks live in subdirectories alongside it.

DESCRIPTION="Office of Data Stewardship and Computing VM"

# Hostnames this machine answers to. `stacks` compares `hostname -s`, `hostname`
# and `hostname -f` against this list (and against the directory name, always),
# case-insensitively, to work out which VM it is running on. That is what lets
# one systemd unit be installed unchanged on every machine.
#
# Confirm with `hostname -f` on the VM itself; if it does not appear here,
# auto-detection fails cleanly and you have to pass --vm odsc.
HOSTNAMES="odsc odsc.prairie.illinois.edu"
