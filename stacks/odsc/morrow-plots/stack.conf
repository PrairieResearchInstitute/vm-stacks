# Metadata for the morrow-plots stack. Sourced as shell; keep it to key=value.

DESCRIPTION="Open WebUI chatbot for the Morrow Plots project"

# Application band (40+), behind owui-postgres at 25: this stack's
# provisioning job talks to it over its socket, same as dagster talks to
# `postgres`.
ORDER=50
ENABLED=1

# `edge` for the proxy, `owui-db` to reach the dedicated owui-postgres
# cluster over TCP for the application itself. NOT `db` -- that is the
# unrelated, dagster-serving `postgres` stack's network.
#
# The provisioning job needs neither -- it reaches the cluster over its Unix
# socket and runs with `network_mode: none`.
NETWORKS="edge owui-db"

# A leaf application: nothing comes up behind it, so there is no reason to
# make `up` block on its healthcheck.
#
# `up` still blocks regardless, on the provisioning job's
# `service_completed_successfully` condition in docker-compose.yml -- not
# governed by this flag. See stacks/isgs/waterdb/stack.conf for the same note.
WAIT=0

PROJECT=morrow-plots

# Image tracking for `stacks bump`:  <ENV_VAR> <image-ref-without-tag> <tag-regex>
#
# Anchored to v0.x release tags only -- Open WebUI also publishes a floating
# `main` and per-arch/-cuda/-ollama variants that this deliberately never
# tracks. v0.11.0 is current as of 2026-09.
#
# POSTGRES_TAG is the client image the provisioning job runs: pgvector/pgvector,
# the same image the dedicated owui-postgres stack runs as a server (NOT the
# unrelated `postgres` stack -- see stacks/odsc/owui-postgres/README.md for
# why this is a separate cluster). Both stacks want the same tag, so bump
# them together -- `stacks bump` tracks each independently and cannot see
# that constraint on its own.
IMAGES="
OWUI_TAG ghcr.io/open-webui/open-webui ^v0\.[0-9]+\.[0-9]+$
POSTGRES_TAG pgvector/pgvector ^[0-9]+\.[0-9]+\.[0-9]+-pg18$
"
