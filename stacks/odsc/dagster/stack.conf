# Metadata for the dagster stack. Sourced as shell; keep it to key=value.

DESCRIPTION="Dagster orchestration for the ODSC ERA5-Land pipeline"

# Application band (40+), behind the postgres cluster at 20: Dagster's instance
# storage lives there, and the provisioning job at the head of this stack talks
# to it over its socket.
ORDER=40
ENABLED=1

# `edge` for the proxy in front of the Dagster UI, `db` to reach the shared
# postgres cluster over TCP for Dagster's instance storage.
#
# The provisioning job needs neither -- it reaches the cluster over its Unix
# socket and runs with `network_mode: none`.
#
# Keep this in step with `networks:` in docker-compose.yml: this list is only
# what `stacks up` creates if missing, and the compose file joins them.
NETWORKS="edge db"

# A leaf: nothing comes up behind it, so there is no reason to pass --wait.
#
# `up` still blocks regardless, on the `service_completed_successfully`
# condition in docker-compose.yml -- the provisioning job has to finish before
# Dagster starts. That is not governed by this flag.
WAIT=0

PROJECT=dagster

# Image tracking for `stacks bump`:  <ENV_VAR> <image-ref-without-tag> <tag-regex>
#
# The dagster-pri release workflow publishes the GitHub release tag verbatim,
# so the pre-release line is four components: 0.1.0-alpha.N. A pre-release
# produces no `latest` and no X.Y alias, which is why .env pins the full tag.
# This regex moves across alpha.N increments and stops before a beta, an rc, or
# the first stable release -- each of which is a deliberate edit here plus a
# matching tag in .env.
#
# Nothing else on this VM shares this image, and nothing else has to move with
# it: the stack talks to the image only through the variables in
# dagster-pri's docs/deploy.md.
#
# POSTGRES_TAG is the client image the provisioning job runs, anchored to the 18
# line exactly as in the postgres stack: both are the same image and want the
# same tag, so bumping one without the other would put a second copy of it on
# the host.
IMAGES="
DAGSTER_TAG ghcr.io/prairieresearchinstitute/dagster-pri ^0\.1\.0-alpha\.[0-9]+$
POSTGRES_TAG postgres ^18\.[0-9]+$
"
