# Metadata for the dagster stack. Sourced as shell; keep it to key=value.

DESCRIPTION="Dagster orchestration for the ISGS water data application"

# Application band (40+), behind waterdb at 50: nothing here needs the web
# application running, but the assets write tables whose schema it owns, so
# coming up after it is the sane order for a full `stacks up`.
ORDER=60
ENABLED=1

# `edge` for the proxy in front of the Dagster UI, `db` to reach the shared
# postgres cluster -- both for Dagster's own instance storage and for the
# application database its assets read and write.
#
# `db` is also the network the run launcher attaches each run container to; see
# run_launcher.config.networks in dagster.yaml. Those containers are created
# outside Compose, so nothing else would put them on it.
#
# The provisioning job needs neither -- it reaches the cluster over its Unix
# socket and runs with `network_mode: none`.
#
# Keep this in step with `networks:` in docker-compose.yml: this list is only
# what `stacks up` creates if missing, and the compose file joins them.
NETWORKS="edge db"

# A leaf: nothing comes up behind it, so there is no reason to pass --wait.
#
# `up` still blocks regardless, on both kinds of depends_on condition in
# docker-compose.yml -- `service_completed_successfully` on the provisioning job
# and `service_healthy` on the code location. Neither is governed by this flag
# and neither gets a --wait-timeout, so a code location that never becomes
# healthy holds the bring-up until its healthcheck retries are exhausted.
WAIT=0

PROJECT=dagster

# Image tracking for `stacks bump`:  <ENV_VAR> <image-ref-without-tag> <tag-regex>
#
# Anchored to the 0.1 alpha line, exactly as in the waterdb stack: bump moves
# across alpha.N increments and stops before a beta, an rc, or the first stable
# release, each of which is a deliberate edit here plus a matching tag in .env.
#
# DAGSTER_TAG MUST HOLD THE SAME VALUE AS WATERDB_TAG in ../waterdb/.env. The
# Dagster image reads application tables whose schema the web application owns,
# and the two are published together on one release tag. Nothing enforces this:
# `bump` queries the two GHCR repositories independently and will happily report
# a new tag for one and not the other. Move them in one commit.
#
# POSTGRES_TAG is the client image the provisioning job runs, anchored to the 18
# line exactly as in the postgres and waterdb stacks: all three are the same
# image and want the same tag, so bumping one without the others would put a
# second copy of it on the host.
IMAGES="
DAGSTER_TAG ghcr.io/prairieresearchinstitute/isgs_waterdb-dagster ^0\.1-alpha\.[0-9]+$
POSTGRES_TAG postgres ^18\.[0-9]+$
"
