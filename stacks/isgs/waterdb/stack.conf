# Metadata for the waterdb stack. Sourced as shell; keep it to key=value.

DESCRIPTION="ISGS water data web application"

# Application band (40+): comes up behind the edge proxy at 10.
ORDER=50
ENABLED=1

# `edge` for the proxy, `db` to reach the shared postgres cluster: both the
# application and the seeding job connect to host `postgres` over TCP. The
# provisioning job needs neither -- it reaches the cluster over its Unix socket
# and runs with `network_mode: none`.
#
# Keep this in step with `networks:` in docker-compose.yml: this list is only
# what `stacks up` creates if missing, and the compose file joins them.
NETWORKS="edge db"

# A leaf application: nothing comes up behind it, so there is no reason to make
# `up` block on its healthcheck.
#
# Note that `up` still blocks on the seeding job regardless -- a
# `service_completed_successfully` dependency is not governed by this, and gets
# no --wait-timeout. See docker-compose.yml.
WAIT=0

PROJECT=waterdb

# Image tracking for `stacks bump`:  <ENV_VAR> <image-ref-without-tag> <tag-regex>
#
# Anchored to the 0.1 alpha line, which is the only thing published so far. That
# keeps bump moving across alpha.N increments and stops it from walking onto a
# beta, an rc, or the first stable release on its own -- each of those is a
# deliberate edit here plus a matching WATERDB_TAG in .env.
#
# WATERDB_TAG pins TWO images: the application and isgs_waterdb-seed, which are
# released together. Only the application's repository is queried below -- one
# variable cannot track two -- so a bump to a tag the seed image has not
# published leaves the seeding job unpullable, and the application not started
# behind it. Publish the pair, or check the seed image before bumping.
#
# POSTGRES_TAG is the client image the provisioning job runs, anchored to the 18
# line exactly as in the postgres stack's stack.conf: the two are the same image
# and want the same tag, so `stacks bump` moving one without the other would put
# a second copy of it on the host.
#
# Note `sort -V` orders 0.1-alpha.2 BEFORE 0.1-alpha.10, correctly, but also
# sorts 0.1-alpha.1 before 0.1; widen the regex only when the tag you want is
# the highest match under it.
IMAGES="
WATERDB_TAG ghcr.io/prairieresearchinstitute/isgs_waterdb ^0\.1-alpha\.[0-9]+$
POSTGRES_TAG postgres ^18\.[0-9]+$
"
