# Metadata for the postgres stack. Sourced as shell; keep it to key=value.

DESCRIPTION="PostgreSQL 18 server for the VM's applications"

# Shared infrastructure band (20-39): comes up after the edge proxy at 10 and
# before any application at 40+.
ORDER=20
ENABLED=1

# Shared network application stacks attach to in order to reach the database.
# Deliberately NOT `edge` -- see docker-compose.yml. `stacks up` creates it if
# missing, so ordering never matters for network existence.
NETWORKS="db"

# Block until pg_isready passes, so an application stack coming up behind this
# one never races initdb on a first boot.
WAIT=1

PROJECT=postgres

# Image tracking for `stacks bump`:  <ENV_VAR> <image-ref-without-tag> <tag-regex>
#
# Anchored to the 18 line and to bare `<major>.<minor>` tags only. That excludes
# the moving `18` tag (a database should be on an explicit patch level), the
# `-alpine` / `-bookworm` / `-trixie` variants, and the next major -- a major
# upgrade needs pg_upgrade or a dump/restore, not a tag bump.
IMAGES="
POSTGRES_TAG postgres ^18\.[0-9]+$
"
