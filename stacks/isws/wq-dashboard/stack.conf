# Metadata for the wq-dashboard stack. Sourced as shell; keep it to key=value.

DESCRIPTION="ISWS water quality dashboard"

# Application band (40+): comes up behind the edge proxy at 10.
ORDER=50
ENABLED=1

# `edge` only. This stack is a single web container with no private
# companions -- its data lives in S3, not on this machine -- so there is
# nothing to keep off the proxy's network.
#
# Keep this in step with `networks:` in docker-compose.yml: this list is only
# what `stacks up` creates if missing, and the compose file joins them.
NETWORKS="edge"

# A leaf application: nothing comes up behind it, so there is no reason to make
# `up` block on its healthcheck.
WAIT=0

PROJECT=wq-dashboard

# Image tracking for `stacks bump`:  <ENV_VAR> <image-ref-without-tag> <tag-regex>
#
# Anchored to v-prefixed three-part release tags, which is what this repository
# publishes. That deliberately excludes `latest` -- the only other tag there
# today -- because a moving tag pinned in .env defeats the point of pinning.
IMAGES="
WQ_DASHBOARD_TAG ghcr.io/puxia2/isws-wq-dashboard ^v[0-9]+\.[0-9]+\.[0-9]+$
"
