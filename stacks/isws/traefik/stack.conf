# Metadata for the traefik stack. Sourced as shell; keep it to key=value.

DESCRIPTION="Edge reverse proxy and TLS termination"

# Lowest ORDER on the VM: everything else registers against a live proxy.
ORDER=10
ENABLED=1

# Shared network other stacks attach to. `stacks up` creates it if missing.
NETWORKS="edge"

# Block until healthy so dependent stacks come up behind a working proxy.
WAIT=1

PROJECT=traefik

# Image tracking for `stacks bump`:  <ENV_VAR> <image-ref-without-tag> <tag-regex>
#
# The regex is what keeps bump honest. Docker Hub carries >2500 traefik tags
# including v2.x and Windows variants (v3.7.11-nanoserver-ltsc2022); anchoring to
# ^v3\.N\.N$ pins us to the v3 line and to release tags only.
IMAGES="
TRAEFIK_TAG traefik ^v3\.[0-9]+\.[0-9]+$
"
