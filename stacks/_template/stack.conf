# Copy this directory to stacks/<name>/ to start a new stack, then edit
# everything below. See docs/adding-a-stack.md.

DESCRIPTION="One line describing what this stack serves"

# Bring-up order, ascending. traefik is 10; leave room between values.
#   10 edge proxy   20-39 shared infra (db, cache)   40+ applications
ORDER=50

# Set to 0 to park a stack without deleting it. `stacks up` skips it, but
# naming it explicitly (`stacks up myapp`) still works.
ENABLED=1

# Shared external networks this stack joins. `stacks up` creates any that are
# missing, so ordering never matters for network existence.
NETWORKS="edge"

# 1 = pass --wait to `up` and block until healthy. Worth it for things later
# stacks depend on; unnecessary noise for leaf applications.
WAIT=0

# Compose project name; defaults to the directory name.
PROJECT=example

# Tag tracking for `stacks bump`:  <ENV_VAR> <image-ref-without-tag> <tag-regex>
#
# One line per image. The regex decides what counts as an upgrade -- anchor it so
# bump cannot drag in a prerelease, a Windows variant, or the next major version:
#   ^v3\.[0-9]+\.[0-9]+$        v3 line only, release tags only
#   ^[0-9]+\.[0-9]+\.[0-9]+$    bare semver, any major
#   ^12\.[0-9]+$                stay on major 12
#
# Registry is inferred from the reference:
#   nginx                 Docker Hub library
#   grafana/grafana       Docker Hub namespace
#   ghcr.io/org/app       GitHub Container Registry (anonymous pull)
#   quay.io/org/app       Quay
IMAGES="
EXAMPLE_TAG nginx ^1\.[0-9]+\.[0-9]+$
"
